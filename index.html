<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriagePilot AI — Email triage for business owners</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand">📥 <strong>TriagePilot</strong> <span class="tag">AI</span></div>
  <div class="sub">Urgent first. Drafts written. Noise filtered.</div>
</header>

<main>
  <section id="digestbar">
    <div id="digest">No emails yet.</div>
    <div class="top-actions">
      <button id="loadSamples">📦 Load sample inbox</button>
      <label class="biz">Business: <input id="bizName" placeholder="Your Business" size="18"></label>
    </div>
  </section>

  <section class="columns">
    <div class="col list-col">
      <h2>Inbox</h2>
      <div id="inbox"></div>
    </div>
    <div class="col detail-col">
      <h2>Details &amp; reply</h2>
      <div id="detail"><p class="empty">Select an email to see details and draft a reply.</p></div>
    </div>
  </section>

  <section class="paste">
    <h2>➕ Paste an email</h2>
    <div class="form">
      <input id="fFrom" placeholder="From (e.g. Jane Doe <jane@example.com>)">
      <input id="fSubject" placeholder="Subject">
      <textarea id="fBody" rows="4" placeholder="Email body — paste it here"></textarea>
      <button id="addBtn">Triage this email</button>
    </div>
  </section>

  <footer>
    <p>🔒 <strong>Privacy:</strong> TriagePilot runs 100% in your browser. Emails never leave this page — no servers, no tracking, no accounts.</p>
  </footer>
</main>

<script src="js/classifier.js"></script>
<script src="js/app.js"></script>
</body>
</html>
